# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=io.github.linkfgfgui
java_version=17

# Common
minecraft_version=1.20.1
mod_name=JEI Patternizer
mod_author=link-fgfgui
mod_id=jeipatternizer
license=LGPL-3.0-only
credits=
description=Encode AE2/RS patterns from a JEI Crafter recipe tree in one key press.
minecraft_version_range=[1.20.1, 1.22)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# JEI
jei_version=15.21.0.148
jei_version_range=[15.21.0.148,)
# fabric's version predicate parser does not support [min,) range syntax (falls back to literal equality),
# fabric.mod.json must use comparison operator notation. Forge's mods.toml supports ranges, keep as-is.
jei_version_range_fabric=>=15.21.0.148

# JEI Crafter (required predecessor)
jeicrafter_group=com.jeicrafter
jeicrafter_version=1.0.0
jeicrafter_version_range=[1.0.0,)
jeicrafter_version_range_fabric=>=1.0.0

# Fabric
fabric_version=0.92.11+1.20.1
fabric_loader_version=0.16.10

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
